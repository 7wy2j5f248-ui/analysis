<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Model Configuration</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      margin: 0;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      border: 1px solid #dbe1e8;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 15px;
    }

    button {
      margin-top: 18px;
      padding: 10px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .current,
    .status {
      margin-top: 16px;
      padding: 12px;
      background: #eef2f7;
      border-radius: 6px;
    }

    .success {
      background: #ecfdf5;
      color: #166534;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }
  </style>
</head>

<body>
  <main>

    <h1>AI Model Configuration</h1>

    <p>
      Configure the researcher-designated AI separately
      for interviewing and data analysis.
    </p>

    <section>
      <h2>Available Providers</h2>
      <p>OpenAI</p>
      <p>Google</p>
    </section>


    <section>
      <h2>Interviewing</h2>

      <div id="interview-current" class="current">
        Loading current configuration...
      </div>

      <label for="interview-provider">Provider</label>
      <select id="interview-provider">
        <option value="">Select provider</option>
        <option value="openai">OpenAI</option>
        <option value="google">Google</option>
      </select>

      <label for="interview-model">Model</label>
      <input
        id="interview-model"
        type="text"
        placeholder="Enter exact provider model ID"
      >

      <button id="save-interview">
        Save Interviewing Configuration
      </button>

      <div id="interview-status" class="status">
        Ready.
      </div>
    </section>


    <section>
      <h2>Data Analysis</h2>

      <div id="analysis-current" class="current">
        Loading current configuration...
      </div>

      <label for="analysis-provider">Provider</label>
      <select id="analysis-provider">
        <option value="">Select provider</option>
        <option value="openai">OpenAI</option>
        <option value="google">Google</option>
      </select>

      <label for="analysis-model">Model</label>
      <input
        id="analysis-model"
        type="text"
        placeholder="Enter exact provider model ID"
      >

      <button id="save-analysis">
        Save Data Analysis Configuration
      </button>

      <div id="analysis-status" class="status">
        Ready.
      </div>
    </section>

  </main>


  <script>
    const configs = {
      interviewing: {
        provider: document.getElementById("interview-provider"),
        model: document.getElementById("interview-model"),
        current: document.getElementById("interview-current"),
        status: document.getElementById("interview-status"),
        button: document.getElementById("save-interview")
      },

      data_analysis: {
        provider: document.getElementById("analysis-provider"),
        model: document.getElementById("analysis-model"),
        current: document.getElementById("analysis-current"),
        status: document.getElementById("analysis-status"),
        button: document.getElementById("save-analysis")
      }
    };


    function providerName(key) {
      if (key === "openai") return "OpenAI";
      if (key === "google") return "Google";
      return key;
    }


    function showCurrent(config, data) {
      if (!data) {
        config.current.textContent =
          "Current configuration: none saved.";
        return;
      }

      config.current.innerHTML =
        `<strong>Current configuration</strong><br>` +
        `Provider: ${providerName(data.provider_key)}<br>` +
        `Model: ${data.model}<br>` +
        `Version: ${data.version}`;

      config.provider.value = data.provider_key;
      config.model.value = data.model;
    }


    async function loadConfiguration(purpose) {
      const config = configs[purpose];

      try {
        const response = await fetch(
          `/api/model-config/${purpose}`
        );

        if (!response.ok) {
          throw new Error("Failed to load configuration.");
        }

        const data = await response.json();

        showCurrent(config, data);

      } catch (error) {
        config.current.textContent =
          "Unable to load current configuration.";

        config.status.textContent = error.message;
        config.status.className = "status error";
      }
    }


    async function saveConfiguration(purpose) {
      const config = configs[purpose];

      const providerKey = config.provider.value;
      const model = config.model.value.trim();

      if (!providerKey || !model) {
        config.status.textContent =
          "Select a provider and enter a model ID.";
        config.status.className = "status error";
        return;
      }

      config.button.disabled = true;
      config.status.textContent = "Saving...";
      config.status.className = "status";

      try {
        const response = await fetch(
          `/api/model-config/${purpose}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              provider_key: providerKey,
              model: model,
              model_settings: {}
            })
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "Failed to save configuration."
          );
        }

        showCurrent(config, result);

        if (result.unchanged) {
          config.status.textContent =
            `No changes to save. Current version remains ${result.version}.`;
        } else {
          config.status.textContent =
            `Configuration saved as version ${result.version}.`;
        }

        config.status.className = "status success";

      } catch (error) {
        config.status.textContent = error.message;
        config.status.className = "status error";

      } finally {
        config.button.disabled = false;
      }
    }


    configs.interviewing.button.addEventListener(
      "click",
      () => saveConfiguration("interviewing")
    );

    configs.data_analysis.button.addEventListener(
      "click",
      () => saveConfiguration("data_analysis")
    );


    loadConfiguration("interviewing");
    loadConfiguration("data_analysis");
  </script>

</body>
</html>
